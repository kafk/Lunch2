<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin – Lunch Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f8faf9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 18px;
            padding: 40px 36px;
            border: 1px solid #e8ebe9;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 24px rgba(0,0,0,.06);
        }
        .logo {
            width: 48px; height: 48px;
            background: #22c55e;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }
        p {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 28px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: #111827;
            letter-spacing: .15em;
            transition: border-color .15s, box-shadow .15s;
            margin-bottom: 18px;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.15);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: background .15s;
        }
        button:hover { background: #16a34a; }
        .error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .version {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #d1d5db;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🍽️</div>
        <h1>Admin</h1>
        <p>Lunch Monitor v{{ version }}</p>

        {% if error %}
        <div class="error">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <label for="password">Lösenord</label>
            <input type="password" id="password" name="password" autofocus placeholder="••••">
            <button type="submit">Logga in</button>
        </form>
        <div class="version">Lunch Monitor</div>
    </div>
</body>
</html>
