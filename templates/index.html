{% extends "base.html" %}

{% block title %}Dagens Lunch{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Dagens Menyer</h2>
        <button class="btn" id="refreshBtn" onclick="loadMenus()">
            🔄 Uppdatera
        </button>
    </div>
    <p id="lastUpdate" style="font-size: 12px; color: #b2bec3; margin-bottom: 16px;"></p>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <p class="loading-text">Hämtar lunchmenyer...</p>
</div>

<div id="menuContainer"></div>

<div class="card" id="emptyState" style="display: none;">
    <div class="empty-state">
        <div class="empty-state-icon">🍽️</div>
        <h3 style="margin-bottom: 8px; color: #2d3436;">Inga restauranger</h3>
        <p>Lägg till restauranger under <a href="/manage" style="color: #0984e3;">Hantera</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const menuContainer = document.getElementById('menuContainer');
    const loading = document.getElementById('loading');
    const refreshBtn = document.getElementById('refreshBtn');
    const emptyState = document.getElementById('emptyState');
    const lastUpdate = document.getElementById('lastUpdate');

    async function loadMenus() {
        refreshBtn.disabled = true;
        loading.style.display = 'block';
        menuContainer.innerHTML = '';
        emptyState.style.display = 'none';

        try {
            const urlsResponse = await fetch('/api/urls');
            const urls = await urlsResponse.json();

            if (urls.length === 0) {
                emptyState.style.display = 'block';
                loading.style.display = 'none';
                refreshBtn.disabled = false;
                return;
            }

            const response = await fetch('/api/menus');
            const menus = await response.json();

            menuContainer.innerHTML = menus.map(menu => `
                <div class="card">
                    <div class="menu-item">
                        <div class="menu-item-header">
                            <span class="menu-item-name">${escapeHtml(menu.name)}</span>
                            ${menu.source ? `<span class="menu-item-source">${escapeHtml(menu.source.substring(0, 30))}</span>` : ''}
                        </div>
                        <div class="menu-item-content ${menu.success ? '' : 'error'}">${escapeHtml(menu.menu)}</div>
                        <div class="menu-item-time">
                            <span>🕐</span>
                            <span>${menu.scraped_at}</span>
                            <span style="margin-left: 8px;">•</span>
                            <a href="${escapeHtml(menu.url)}" target="_blank" style="color: #0984e3; margin-left: 8px;">Besök sidan →</a>
                        </div>
                    </div>
                </div>
            `).join('');

            lastUpdate.textContent = `Senast uppdaterad: ${new Date().toLocaleTimeString('sv-SE')}`;
        } catch (error) {
            menuContainer.innerHTML = '<div class="card"><div class="error">Kunde inte hämta menyer. Försök igen.</div></div>';
        }

        loading.style.display = 'none';
        refreshBtn.disabled = false;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadMenus();
</script>
{% endblock %}
