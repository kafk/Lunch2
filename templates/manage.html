{% extends "base.html" %}

{% block title %}Hantera Restauranger{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h2 class="card-title">Lägg till restaurang</h2>
    </div>
    <form id="addForm">
        <div class="form-group">
            <label for="name">Namn (valfritt)</label>
            <input type="text" id="name" placeholder="T.ex. Restaurang X">
        </div>
        <div class="form-group">
            <label for="url">URL till lunchmeny</label>
            <input type="url" id="url" placeholder="https://exempel.se/lunch" required>
        </div>
        <button type="submit" class="btn">+ Lägg till</button>
    </form>
    <div id="addMessage" style="margin-top: 16px;"></div>
</div>

<div class="card">
    <div class="card-header">
        <h2 class="card-title">Mina restauranger</h2>
        <span class="see-all" id="urlCount"></span>
    </div>
    <ul class="url-list" id="urlList">
        <li class="empty-state">
            <div class="spinner" style="width: 32px; height: 32px;"></div>
        </li>
    </ul>
</div>
{% endblock %}

{% block scripts %}
<script>
    const urlList = document.getElementById('urlList');
    const addForm = document.getElementById('addForm');
    const addMessage = document.getElementById('addMessage');
    const urlCount = document.getElementById('urlCount');

    async function loadUrls() {
        try {
            const response = await fetch('/api/urls');
            const urls = await response.json();

            urlCount.textContent = `${urls.length} st`;

            if (urls.length === 0) {
                urlList.innerHTML = `
                    <li class="empty-state">
                        <div class="empty-state-icon">📍</div>
                        <p>Inga restauranger tillagda än</p>
                    </li>
                `;
                return;
            }

            urlList.innerHTML = urls.map((item, index) => `
                <li class="url-item">
                    <div class="info">
                        <div class="name">${escapeHtml(item.name)}</div>
                        <div class="url">${escapeHtml(item.url)}</div>
                    </div>
                    <button class="btn btn-danger" onclick="deleteUrl(${index})" style="padding: 10px 16px; font-size: 13px;">
                        🗑️ Ta bort
                    </button>
                </li>
            `).join('');
        } catch (error) {
            urlList.innerHTML = '<li class="error">Kunde inte ladda restauranger</li>';
        }
    }

    async function deleteUrl(index) {
        if (!confirm('Är du säker på att du vill ta bort denna restaurang?')) return;

        try {
            const response = await fetch(`/api/urls/${index}`, { method: 'DELETE' });
            if (response.ok) {
                loadUrls();
            }
        } catch (error) {
            alert('Kunde inte ta bort restaurang');
        }
    }

    addForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const url = document.getElementById('url').value;

        try {
            const response = await fetch('/api/urls', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url })
            });

            const result = await response.json();

            if (response.ok) {
                addMessage.innerHTML = '<div class="success">✓ Restaurang tillagd!</div>';
                addForm.reset();
                loadUrls();
            } else {
                addMessage.innerHTML = `<div class="error">✗ ${escapeHtml(result.error)}</div>`;
            }

            setTimeout(() => { addMessage.innerHTML = ''; }, 3000);
        } catch (error) {
            addMessage.innerHTML = '<div class="error">✗ Något gick fel</div>';
        }
    });

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    loadUrls();
</script>
{% endblock %}
